<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 494" width="912" height="494" role="img" aria-labelledby="diagram-overview-title diagram-overview-desc">
  <title id="diagram-overview-title">Order Service</title>
  <desc id="diagram-overview-desc">sequence diagram, Order Service: 4 boxes and 5 relationships drawn</desc>
  <style>
    /* Boxes: paper fill, ink hairline. A box that opens a page says so with a
   dotted underline on its name rather than with the accent, because six
   openers on one page would be six accents and the accent would mean nothing. */
.box-frame { fill: #fbfbfa; stroke: #1b1b1a; stroke-width: 1; }
    .box-label { fill: #1b1b1a; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
    /* Lines: muted hairlines. A label on a line is technical and is set in mono. */
.edge { fill: none; stroke: #62625f; stroke-width: 1; }
    .edge marker, #arrow path { fill: #62625f; }
    .edge-label { fill: #62625f; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; text-anchor: middle; }
    /* A band is a zone: a quieter paper, a solid hairline, and a mono uppercase
   label in the corner. */
.region-frame { fill: #f2f2ef; stroke: #cfcfca; stroke-width: 1; }
    .region-label { fill: #8a8a86; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; }
    /* The sequence ladder and the state furniture, to the same rules. */
.lifeline { stroke: #cfcfca; stroke-width: 1; stroke-dasharray: 4 4; }
    .activation { fill: #f2f2ef; stroke: #62625f; stroke-width: 0.8; }
    .fragment-frame { fill: none; stroke: #cfcfca; stroke-width: 1; }
    .fragment-label { fill: #8a8a86; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
    .marker-filled { fill: #1b1b1a; }
    .marker-ring { fill: none; stroke: #1b1b1a; stroke-width: 1; }
    .figure { fill: none; stroke: #1b1b1a; stroke-width: 1; }
    .figure circle, circle.figure { fill: #fbfbfa; }
  </style>
  <g transform="translate(0 0) scale(1)">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
  <path class="edge" data-edge-id="m.accepted" data-edge-from="ll.api" data-edge-to="ll.customer" data-edge-from-side="left" data-edge-to-side="right" data-composition-points="346,388 126,388" d="M 346 388 L 126 388" marker-end="url(#arrow)"/>
  <path class="edge" data-edge-id="m.notify" data-edge-from="ll.api" data-edge-to="ll.notifier" data-edge-from-side="right" data-edge-to-side="left" data-composition-points="346,330 786,330" d="M 346 330 L 786 330" marker-end="url(#arrow)"/>
  <path class="edge" data-edge-id="m.place" data-edge-from="ll.customer" data-edge-to="ll.api" data-edge-from-side="right" data-edge-to-side="left" data-composition-points="126,156 346,156" d="M 126 156 L 346 156" marker-end="url(#arrow)"/>
  <path class="edge" data-edge-id="m.save" data-edge-from="ll.api" data-edge-to="ll.store" data-edge-from-side="right" data-edge-to-side="left" data-composition-points="346,214 566,214" d="M 346 214 L 566 214" marker-end="url(#arrow)"/>
  <path class="edge" data-edge-id="m.saved" data-edge-from="ll.store" data-edge-to="ll.api" data-edge-from-side="left" data-edge-to-side="right" data-composition-points="566,272 346,272" d="M 566 272 L 346 272" marker-end="url(#arrow)"/>
  <line class="lifeline" x1="346" y1="100" x2="346" y2="470"/>
  <line class="lifeline" x1="126" y1="100" x2="126" y2="470"/>
  <line class="lifeline" x1="786" y1="100" x2="786" y2="470"/>
  <line class="lifeline" x1="566" y1="100" x2="566" y2="470"/>
  <rect class="activation" data-bar-id="act.api" data-bar-box="ll.api" x="340" y="156" width="12" height="251"/>
  <rect class="activation" data-bar-id="act.store" data-bar-box="ll.store" x="560" y="214" width="12" height="77"/>
  <g class="box" data-box-id="ll.api" data-box-bounds="268,48,156,52">
    <rect class="box-frame" x="268" y="48" width="156" height="52" rx="8"/>
    <text class="box-label" x="346" y="79">Order API</text>
  </g>
  <g class="box" data-box-id="ll.customer" data-box-bounds="48,48,156,52">
    <rect class="box-frame" x="48" y="48" width="156" height="52" rx="8"/>
    <text class="box-label" x="126" y="79">Customer</text>
  </g>
  <g class="box" data-box-id="ll.notifier" data-box-bounds="708,48,156,52">
    <rect class="box-frame" x="708" y="48" width="156" height="52" rx="8"/>
    <text class="box-label" x="786" y="79">Notifier</text>
  </g>
  <g class="box" data-box-id="ll.store" data-box-bounds="488,48,156,52">
    <rect class="box-frame" x="488" y="48" width="156" height="52" rx="8"/>
    <text class="box-label" x="566" y="79">Order Store</text>
  </g>
  <g class="fragment" data-frame-id="frag.notify" data-frame-kind="opt">
    <rect class="fragment-frame" x="326" y="296" width="480" height="54"/>
    <text class="fragment-label" x="334" y="312">opt [customer opted in]</text>
  </g>
  <text class="edge-label" data-edge-label-for="m.accepted" x="236" y="388" dy="-6" text-anchor="middle" font-size="11" data-label-bounds="212.9,368.8,46.199999999999996,13.2">orderID</text>
  <text class="edge-label" data-edge-label-for="m.notify" x="566" y="330" dy="-6" text-anchor="middle" font-size="11" data-label-bounds="490.1,310.8,151.79999999999998,13.2">notify(orderID, Placed)</text>
  <text class="edge-label" data-edge-label-for="m.place" x="236" y="156" dy="-6" text-anchor="middle" font-size="11" data-label-bounds="179.9,136.8,112.2,13.2">placeOrder(order)</text>
  <text class="edge-label" data-edge-label-for="m.save" x="456" y="214" dy="-6" text-anchor="middle" font-size="11" data-label-bounds="419.7,194.8,72.6,13.2">save(order)</text>
  <text class="edge-label" data-edge-label-for="m.saved" x="456" y="272" dy="-6" text-anchor="middle" font-size="11" data-label-bounds="432.9,252.8,46.199999999999996,13.2">orderID</text>
  </g>
</svg>
